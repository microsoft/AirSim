<!DOCTYPE html>
<html>
<head>
    <title>Arkhe Network Visualization</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; color: white; font-family: monospace; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 5px;
            z-index: 100;
        }
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 5px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Arkhe(N) OS</h2>
        <p>Syzygy: <span id="syzygy">0.98</span></p>
        <p>Satoshi: <span id="satoshi">7.28</span> bits</p>
        <p>Bolhas ativas: 42</p>
        <p>Coerência global: <span id="coherence">0.86</span></p>
    </div>
    <div id="controls">
        <p>Fase: <span id="phase">0.00</span> rad | ε: -3.71e-11</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Configuração da cena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controles
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Luzes
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        // Parâmetros da rede
        const numBubbles = 42;
        const earthRadius = 1.5;
        const bubbles = [];
        const bubbleGroup = new THREE.Group();

        // Criar bolhas
        for (let i = 0; i < numBubbles; i++) {
            // Distribuição uniforme na esfera
            const theta = 2 * Math.PI * i / numBubbles;
            const phi = Math.acos(1 - 2 * i / numBubbles);

            const x = earthRadius * Math.sin(phi) * Math.cos(theta);
            const y = earthRadius * Math.sin(phi) * Math.sin(theta);
            const z = earthRadius * Math.cos(phi);

            // Geometria da bolha
            const geometry = new THREE.SphereGeometry(0.12, 32, 16);
            const material = new THREE.MeshStandardMaterial({
                color: 0xaa66ff,
                emissive: 0x330066,
                transparent: true,
                opacity: 0.8
            });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            bubbleGroup.add(sphere);
            bubbles.push(sphere);
        }
        scene.add(bubbleGroup);

        // Linhas de emaranhamento (conexões)
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x8866ff, transparent: true, opacity: 0.15 });
        for (let i = 0; i < numBubbles; i++) {
            for (let j = i+1; j < numBubbles; j += 5) {  // conexões esparsas para visualização
                const points = [
                    bubbles[i].position.clone(),
                    bubbles[j].position.clone()
                ];
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(line);
            }
        }

        // Partículas de emaranhamento
        const particleGeometry = new THREE.BufferGeometry();
        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const r = earthRadius + 0.5 + Math.random() * 0.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = r * Math.cos(phi);
        }
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMaterial = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.02 });
        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // Anel central (Toro)
        const torusGeometry = new THREE.TorusGeometry(earthRadius * 1.2, 0.05, 32, 128);
        const torusMaterial = new THREE.MeshStandardMaterial({ color: 0x553399, emissive: 0x220044 });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.rotation.x = Math.PI / 2;
        scene.add(torus);

        // Estrelas de fundo
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 200;
            starPositions[i*3+2] = (Math.random() - 0.5) * 200;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Animação
        let time = 0;
        let satoshi = 7.28;
        let syzygy = 0.98;
        let coherence = 0.86;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.01;

            // Atualiza valores com pequenas variações
            syzygy = 0.98 + 0.01 * Math.sin(time);
            coherence = 0.86 + 0.01 * Math.cos(time * 0.5);

            document.getElementById('syzygy').innerText = syzygy.toFixed(3);
            document.getElementById('coherence').innerText = coherence.toFixed(3);
            document.getElementById('phase').innerText = (time % (2*Math.PI)).toFixed(3);

            // Pulsação das bolhas
            bubbles.forEach((bubble, i) => {
                const scale = 1 + 0.1 * Math.sin(time * 2 + i);
                bubble.scale.set(scale, scale, scale);
            });

            // Rotação do grupo
            bubbleGroup.rotation.y += 0.001;
            torus.rotation.z += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Redimensionamento
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
